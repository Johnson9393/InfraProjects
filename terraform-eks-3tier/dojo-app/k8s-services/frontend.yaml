apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: dojo
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dojo-dev-frontend:39e0251aeb7dd5a4d00ec41be9975fa7350d0b84
          ports:
          - containerPort: 3000

          env:
            # Frontend application configuration
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: APP_VERSION

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: APP_NAME

            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: BACKEND_URL

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
