apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo # This is the name of the Statefulset
spec:
  serviceName: stateful-demo
  replicas: 2

  selector:
    matchLabels:
      app: stateful-demo # Pods matched with this label belongs to Statefulset
  
  template:
    metadata:
      labels:
        app: stateful-demo # Pods created by this template will have this label
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-data
              mountPath: /data
    
  volumeClaimTemplates:
  - metadata:
      name: app-data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      resources:
          requests:
            storage: 1Gi

