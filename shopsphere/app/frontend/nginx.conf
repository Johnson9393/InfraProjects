server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the API gateway
    # when client requests /api/products then it will follow these checks and resolves dns and forward the request to api-gateway along with request headers like host, real-ip, forwarded-for and authorization headers.
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;
        set $gateway api-gateway.shopsphere-dev.svc.cluster.local;
        proxy_pass http://$gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html; #if uri path not found, serve index.html
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
