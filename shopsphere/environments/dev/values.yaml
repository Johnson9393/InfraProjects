# Dev environment overrides.
global:
  environment: dev
  namespace: shopsphere-dev
  awsRegion: us-east-1
  imagePullPolicy: IfNotPresent

# Dev ECR image repositories used by the ShopSphere workloads.
services:
  productService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-product-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

  userService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-user-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

  cartService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-cart-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

  orderService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-order-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

  paymentService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-payment-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

  notificationService:
    image:
      repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-notification-service
      tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

# Dev ECR image repositories for the gateway and frontend.
apiGateway:
  image:
    repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-api-gateway
    tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

frontend:
  image:
    repository: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-frontend
    tag: "fa8888ad546aa91aceda97f03963e1758267fe35"

seedJob:
  image: 023192525105.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-seed:fa8888ad546aa91aceda97f03963e1758267fe35

# Dev ALB configuration.
ingress:
  enabled: true
  className: alb
  groupName: shopsphere-dev-alb
  host: shop-dev.example.com
  acmCertArn: <DEV_ACM_CERTIFICATE_ARN>