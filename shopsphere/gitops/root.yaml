# Parent Application (app of apps).
# This is the only YAML you kubectl-apply once Argo exists.
# It does not deploy product-service. It deploys the Application files under apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-app-of-apps
  namespace: dev-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Johnson9393/InfraProjects.git
    targetRevision: main
    path: shopsphere/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
