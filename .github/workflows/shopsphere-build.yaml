
name: shopsphere-build-push

on:
  push:
    branches:
      - main
    paths:
      - "shopsphere/app/**"

  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Select the environment"
        required: true
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::023192525105:role/github-ecr-role

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'dev' }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: shopsphere/app/frontend
            ecr_suffix: frontend

          - name: api-gateway
            context: shopsphere/app/api-gateway
            ecr_suffix: api-gateway

          - name: product-service
            context: shopsphere/app/services/product-service
            ecr_suffix: product-service

          - name: user-service
            context: shopsphere/app/services/user-service
            ecr_suffix: user-service

          - name: cart-service
            context: shopsphere/app/services/cart-service
            ecr_suffix: cart-service

          - name: order-service
            context: shopsphere/app/services/order-service
            ecr_suffix: order-service

          - name: payment-service
            context: shopsphere/app/services/payment-service
            ecr_suffix: payment-service

          - name: notification-service
            context: shopsphere/app/services/notification-service
            ecr_suffix: notification-service

          - name: seed-job
            context: shopsphere/app/seed-job
            ecr_suffix: seed

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        shell: bash
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Build and push ${{ matrix.name }}
        shell: bash
        env:
          SERVICE_CONTEXT: ${{ matrix.context }}
          ECR_SUFFIX: ${{ matrix.ecr_suffix }}
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          ECR_REPOSITORY="${{ inputs.environment || 'dev' }}-shopsphere-${ECR_SUFFIX}"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:buildcache" \
            --cache-to "type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:buildcache",mode=max,image-manifest=true,oci-mediatypes=true" \
            "$SERVICE_CONTEXT"
