name: dojo-eks-argo-deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform-eks-3tier/dojo-app/src/**"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Select the environment to deploy to"
        required: true
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::023192525105:role/github-ecr-role

jobs: 
  build:
    runs-on: ubuntu-latest
  
    permissions:
      contents: read
      id-token: write
    
    strategy:
      matrix:
        services:
          - name: frontend
            path: terraform-eks-3tier/dojo-app/src/frontend
            ecr_repo: dojo-dev-frontend

          - name: backend
            path: terraform-eks-3tier/dojo-app/src/backend
            ecr_repo: dojo-dev-backend
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{env.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{env.AWS_REGION}} | \
          docker login --username AWS --password-stdin \
          $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{env.AWS_REGION}}.amazonaws.com
      
      - name: Build and Push ${{ matrix.services.name }}
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{env.AWS_REGION}}.amazonaws.com

          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t $ECR_REGISTRY/${{ matrix.services.ecr_repo }}:${{ github.sha }} \
            --cache-from type=registry,ref=$ECR_REGISTRY/${{ matrix.services.ecr_repo }}:buildcache \
            --cache-to type=registry,ref=$ECR_REGISTRY/${{ matrix.services.ecr_repo }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
            ${{ matrix.services.path }}
  
  # Once images pushed to ECR, bump the image tags in the k8s deployment manifests and deploy to EKS
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: update image tags in k8s deployment manifests
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{env.AWS_REGION}}.amazonaws.com
          BACKEND_IMAGE_TAG="${{ ECR_REGISTRY }}/dojo-dev-backend:${{ github.sha }}"
          FRONTEND_IMAGE_TAG="${{ ECR_REGISTRY }}/dojo-dev-frontend:${{ github.sha }}"

          sed -i "s|image: ${{ ECR_REGISTRY }}/dojo-dev-backend:.*|image: ${BACKEND_IMAGE_TAG}|" terraform-eks-3tier/dojo-app/k8s-services/backend.yaml
          sed -i "s|image: ${{ ECR_REGISTRY }}/dojo-dev-frontend:.*|image: ${FRONTEND_IMAGE_TAG}|" terraform-eks-3tier/dojo-app/k8s-services/frontend.yaml

          echo "Updated backend image tag to: ${BACKEND_IMAGE_TAG}"
          echo "Updated frontend image tag to: ${FRONTEND_IMAGE_TAG}"
          grep "image:" terraform-eks-3tier/dojo-app/k8s-services/backend.yaml terraform-eks-3tier/dojo-app/k8s-services/frontend.yaml

      - name: Commit and push changes of manifests to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
          terraform-eks-3tier/dojo-app/k8s-services/backend.yaml \
          terraform-eks-3tier/dojo-app/k8s-services/frontend.yaml

          if git diff --cached --quiet; then
            echo "images already match ${{ github.sha }}, no changes to commit"
            exit 0 
          fi
            git commit -m "Update image tags in k8s deployment manifests"
            git push origin main
          