
name: ShopSphere Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply one stack, or destroy all ShopSphere infra (not OIDC, not state bucket)"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy

      environment:
        description: "Environment to manage"
        type: choice
        required: true
        options:
          - dev
          - prod

      infra_path:
        description: "Terraform directory (apply only; ignored on destroy)"
        type: choice
        required: true
        options:
          - shopsphere-infra/infra/core-infra/cluster
          - shopsphere-infra/infra/core-infra/k8-services
          - shopsphere-infra/infra/app-infra

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.15.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.environment }}
  TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
  TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
  TF_VAR_razorpay_webhook_secret: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
  TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform-plan:
    name: Terraform Plan
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure workflow runs from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check environment configuration
        working-directory: ${{ inputs.infra_path }}
        shell: bash
        run: |
          test -s "vars/${TF_ENV}.tfbackend" || {
            echo "::error::Missing or empty vars/${TF_ENV}.tfbackend"
            exit 1
          }

          test -s "vars/${TF_ENV}.tfvars" || {
            echo "::error::Missing or empty vars/${TF_ENV}.tfvars"
            exit 1
          }

      - name: Terraform Format Check
        working-directory: ${{ inputs.infra_path }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -backend-config="vars/${TF_ENV}.tfbackend"

      - name: Terraform Validate
        working-directory: ${{ inputs.infra_path }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform plan \
            -input=false \
            -var-file="vars/${TF_ENV}.tfvars" \
            -out=tfplan

          terraform show -no-color tfplan | tee tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ inputs.infra_path }}/tfplan
            ${{ inputs.infra_path }}/tfplan.txt
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  terraform-apply:
    name: Terraform Apply
    if: inputs.action == 'apply'
    needs: terraform-plan
    runs-on: ubuntu-latest

    # This job pauses for approval when required reviewers
    # are configured in the selected GitHub Environment.
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Reviewed Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ inputs.infra_path }}

      - name: Terraform Init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -input=false \
            -backend-config="vars/${TF_ENV}.tfbackend"

      - name: Terraform Apply
        working-directory: ${{ inputs.infra_path }}
        run: terraform apply -input=false tfplan

  terraform-destroy:
    name: Terraform Destroy
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure workflow runs from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Remove Argo Application so it does not recreate workloads
        continue-on-error: true
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${TF_ENV}-shopsphere" \
            --region "${AWS_REGION}"

          kubectl delete application shopsphere-dev \
            -n "${TF_ENV}-argocd" \
            --ignore-not-found

      - name: Destroy ShopSphere stacks in reverse order
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="${TF_ENV}-shopsphere"

          leftovers() {
            CLUSTER_NAME="${CLUSTER_NAME}" \
              TF_ENV="${TF_ENV}" \
              AWS_REGION="${AWS_REGION}" \
              bash shopsphere-infra/scripts/eks-destroy-leftovers.sh || true
          }

          destroy_stack() {
            local dir="$1"

            test -s "${dir}/vars/${TF_ENV}.tfbackend"
            test -s "${dir}/vars/${TF_ENV}.tfvars"

            terraform -chdir="${dir}" init \
              -input=false \
              -backend-config="vars/${TF_ENV}.tfbackend"

            terraform -chdir="${dir}" destroy \
              -input=false \
              -auto-approve \
              -var-file="vars/${TF_ENV}.tfvars"
          }

          destroy_stack shopsphere-infra/infra/app-infra
          leftovers
          destroy_stack shopsphere-infra/infra/core-infra/k8-services
          leftovers
          # EKS CNI ENIs and the AWS-managed cluster SG are not in Terraform
          # state. First cluster destroy often dies on subnet/VPC; leftovers
          # then a second destroy finishes the VPC.
          set +e
          destroy_stack shopsphere-infra/infra/core-infra/cluster
          cluster_rc=$?
          set -e
          leftovers
          if [[ "${cluster_rc}" -ne 0 ]]; then
            echo "Cluster destroy failed once; retrying after leftover cleanup"
            destroy_stack shopsphere-infra/infra/core-infra/cluster
          fi
