
name: ShopSphere Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply one stack, or destroy all ShopSphere infra (not OIDC, not state bucket)"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy

      environment:
        description: "Environment to manage"
        type: choice
        required: true
        options:
          - dev
          - prod

      infra_path:
        description: "Terraform directory (apply only; ignored on destroy)"
        type: choice
        required: true
        options:
          - shopsphere-infra/infra/core-infra/cluster
          - shopsphere-infra/infra/core-infra/k8-services
          - shopsphere-infra/infra/app-infra

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.15.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.environment }}
  TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
  TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
  TF_VAR_razorpay_webhook_secret: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
  TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform-plan:
    name: Terraform Plan
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure workflow runs from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check environment configuration
        working-directory: ${{ inputs.infra_path }}
        shell: bash
        run: |
          test -s "vars/${TF_ENV}.tfbackend" || {
            echo "::error::Missing or empty vars/${TF_ENV}.tfbackend"
            exit 1
          }

          test -s "vars/${TF_ENV}.tfvars" || {
            echo "::error::Missing or empty vars/${TF_ENV}.tfvars"
            exit 1
          }

      - name: Terraform Format Check
        working-directory: ${{ inputs.infra_path }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -backend-config="vars/${TF_ENV}.tfbackend"

      - name: Terraform Validate
        working-directory: ${{ inputs.infra_path }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform plan \
            -input=false \
            -var-file="vars/${TF_ENV}.tfvars" \
            -out=tfplan

          terraform show -no-color tfplan | tee tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ inputs.infra_path }}/tfplan
            ${{ inputs.infra_path }}/tfplan.txt
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  terraform-apply:
    name: Terraform Apply
    if: inputs.action == 'apply'
    needs: terraform-plan
    runs-on: ubuntu-latest

    # This job pauses for approval when required reviewers
    # are configured in the selected GitHub Environment.
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Reviewed Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ inputs.infra_path }}

      - name: Terraform Init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -input=false \
            -backend-config="vars/${TF_ENV}.tfbackend"

      - name: Terraform Apply
        working-directory: ${{ inputs.infra_path }}
        run: terraform apply -input=false tfplan

  terraform-destroy:
    name: Terraform Destroy
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure workflow runs from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_TERRAFORM_ROLE_ARN_DEV || vars.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Remove Argo Application so it does not recreate workloads
        continue-on-error: true
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${TF_ENV}-shopsphere" \
            --region "${AWS_REGION}"

          kubectl delete application shopsphere-dev \
            -n "${TF_ENV}-argocd" \
            --ignore-not-found

      - name: Destroy ShopSphere stacks in reverse order
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="${TF_ENV}-shopsphere"

          # The shared ALB is created by the AWS Load Balancer Controller, not
          # Terraform. If Helm removes the controller first, the ALB stays up
          # with the ACM cert attached and terraform destroy hangs on ACM.
          delete_leftover_albs() {
            echo "Looking for leftover ALBs tagged elbv2.k8s.aws/cluster=${CLUSTER_NAME}"

            local arns
            arns="$(
              aws elbv2 describe-load-balancers --region "${AWS_REGION}" \
                --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null || true
            )"

            if [[ -z "${arns}" || "${arns}" == "None" ]]; then
              echo "No load balancers in the account region."
              return 0
            fi

            local arn cluster_tag
            for arn in ${arns}; do
              cluster_tag="$(
                aws elbv2 describe-tags --region "${AWS_REGION}" --resource-arns "${arn}" \
                  --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value | [0]" \
                  --output text 2>/dev/null || true
              )"
              if [[ "${cluster_tag}" == "${CLUSTER_NAME}" ]]; then
                echo "Deleting leftover ALB ${arn}"
                aws elbv2 delete-load-balancer --region "${AWS_REGION}" --load-balancer-arn "${arn}"
              fi
            done
          }

          release_acm_from_albs() {
            echo "Deleting Ingress objects so the controller can drop the ALB (if it is still running)"
            aws eks update-kubeconfig \
              --name "${CLUSTER_NAME}" \
              --region "${AWS_REGION}" || return 0

            kubectl delete ingress --all -A --ignore-not-found || true

            local i leftover
            for i in $(seq 1 30); do
              leftover=0
              local arn cluster_tag
              for arn in $(
                aws elbv2 describe-load-balancers --region "${AWS_REGION}" \
                  --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null || true
              ); do
                [[ -z "${arn}" || "${arn}" == "None" ]] && continue
                cluster_tag="$(
                  aws elbv2 describe-tags --region "${AWS_REGION}" --resource-arns "${arn}" \
                    --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value | [0]" \
                    --output text 2>/dev/null || true
                )"
                if [[ "${cluster_tag}" == "${CLUSTER_NAME}" ]]; then
                  leftover=$((leftover + 1))
                fi
              done
              if [[ "${leftover}" -eq 0 ]]; then
                echo "No cluster ALBs left."
                return 0
              fi
              echo "Cluster ALBs still present (${leftover}), waiting (${i}/30)..."
              sleep 20
            done

            echo "Cluster ALBs still present after wait; force-deleting."
            delete_leftover_albs
          }

          destroy_stack() {
            local dir="$1"

            test -s "${dir}/vars/${TF_ENV}.tfbackend"
            test -s "${dir}/vars/${TF_ENV}.tfvars"

            terraform -chdir="${dir}" init \
              -input=false \
              -backend-config="vars/${TF_ENV}.tfbackend"

            terraform -chdir="${dir}" destroy \
              -input=false \
              -auto-approve \
              -var-file="vars/${TF_ENV}.tfvars"
          }

          destroy_stack shopsphere-infra/infra/app-infra
          release_acm_from_albs || true
          delete_leftover_albs || true
          destroy_stack shopsphere-infra/infra/core-infra/k8-services
          delete_leftover_albs || true
          destroy_stack shopsphere-infra/infra/core-infra/cluster
